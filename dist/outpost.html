<title>Outpost</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
/* Layout: one full-bleed 3D scene, with game-style panels floating on top of it. Single dusk look by choice. */
:root{
  color-scheme:dark;
  --night:#0B0C26; --indigo:#1B1B52; --panel:rgba(20,20,62,.86); --panel-2:rgba(255,244,214,.07);
  --line:rgba(255,244,214,.16); --cream:#FFF4D6; --cream-lip:#B9A873; --ink:#FFF4D6; --ink-2:#C4C2E6; --ink-3:#8E8CC0;
  --on-cream:#1A1642; --coral:#FF7A59; --coral-lip:#B8472B; --amber:#FFC857; --amber-lip:#B98B26;
  --mint:#6FE8C0; --sky:#6FC3FF; --lilac:#B79CFF; --pink:#FF7EB6; --red:#FF5470;
  --ui:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --g:16px; --r:18px;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:2px}
.app{position:relative;height:100%;min-height:520px;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,#6A3472 0%,#2B2168 42%,#0B0C26 100%);user-select:none;-webkit-user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}#gl.hit{cursor:pointer}

/* ---------- labels that follow things in the scene ---------- */
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tags>*{position:absolute;left:0;top:0;will-change:transform;white-space:nowrap}
.slab{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--on-cream);background:var(--c,var(--cream));padding:3px 8px 2px;border-radius:7px;font-weight:600;box-shadow:0 2px 0 rgba(0,0,0,.28);pointer-events:auto;cursor:pointer}
.slab b{margin-left:6px;background:var(--on-cream);color:var(--cream);border-radius:999px;padding:0 6px;font-weight:600}
.slab b:empty{display:none}
.tag{font-size:12px;font-weight:700;color:var(--cream);background:rgba(11,12,38,.72);border:1.5px solid var(--c,var(--line));padding:1px 8px 2px;border-radius:999px;pointer-events:auto;cursor:pointer;transition:opacity .2s}
.tag.sel{background:var(--c);color:var(--on-cream)}
.tag.need{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,200,87,.28)}
.tag.held{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,84,112,.3)}
.bub{font-size:13px;font-weight:600;color:var(--on-cream);background:var(--cream);padding:4px 10px 5px;border-radius:12px 12px 12px 3px;box-shadow:0 3px 0 rgba(0,0,0,.25);opacity:0;transition:opacity .15s;transform-origin:0 100%}
.bub.on{opacity:1;animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{scale:.4}to{scale:1}}
.app[data-zoom="far"] .tag:not(.sel):not(.need):not(.held){opacity:0;pointer-events:none}
.app[data-zoom="far"] .bub{font-size:11px;padding:2px 7px 3px}

/* ---------- panels ---------- */
.top,.crew,.inspect,.alerts,.radio,.coach,.bar,.list,.credit{position:absolute;z-index:2}
.pn,.crew,.inspect,.radio,.coach,.list{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top{left:0;right:0;top:0;padding:14px var(--g) 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:44px;height:44px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.brand-t b{display:block;font-size:26px;line-height:1;font-weight:800;letter-spacing:-.03em}
.brand-t span{display:block;margin-top:3px;font-size:12px;color:var(--ink-2)}
.brand-t i{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-cream);background:var(--amber);padding:1px 5px;border-radius:5px;margin-left:4px;vertical-align:1px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.st{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:6px 12px 7px;min-width:74px;text-align:center}
.st b{display:block;font-size:20px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.st span{display:block;font-size:10.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;font-family:var(--mono)}
.st.need.on{background:var(--amber);border-color:var(--amber);color:var(--on-cream);cursor:pointer;animation:nudge 1.6s ease-in-out infinite}
.st.need.on span{color:var(--on-cream)}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px)}}

.crew{left:var(--g);top:78px;width:214px;padding:8px;display:flex;flex-direction:column;gap:3px;max-height:calc(100% - 78px - 190px);overflow:auto}
.crew h2{margin:2px 6px 5px;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}
.cw{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;border-radius:12px;padding:5px 7px}
.cw:hover{background:var(--panel-2)}
.cw.sel{background:rgba(255,244,214,.13);box-shadow:inset 0 0 0 1.5px var(--c)}
.av{flex:none;width:30px;height:26px;border-radius:9px;background:var(--c);display:grid;place-items:center;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.28)}
.av::before{content:"";width:20px;height:11px;border-radius:5px;background:#15143A}
.av::after{content:"";position:absolute;width:4px;height:5px;border-radius:2px;background:var(--cream);box-shadow:7px 0 0 var(--cream);translate:-3.5px 0}
.cw .n{min-width:0;flex:1}
.cw b{display:block;font-size:14px;font-weight:700;line-height:1.15}
.cw em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw.need em{color:var(--amber)}.cw.held em{color:var(--red)}.cw.paused{opacity:.62}
.lv{display:flex;gap:2px;flex:none}
.lv i{width:5px;height:5px;border-radius:50%;background:rgba(255,244,214,.22)}
.lv i.on{background:var(--cream)}

.inspect{right:var(--g);top:78px;width:312px;padding:14px;max-height:calc(100% - 78px - 190px);overflow:auto;display:flex;flex-direction:column;gap:12px}
.in-h{display:flex;align-items:center;gap:10px}
.in-h .av{width:44px;height:38px;border-radius:12px}
.in-h .av::before{width:30px;height:16px;border-radius:7px}
.in-h .av::after{width:5px;height:8px;border-radius:3px;box-shadow:10px 0 0 var(--cream);translate:-5px 0}
.in-h .dot{width:44px;height:38px;border-radius:12px;background:var(--c);flex:none;box-shadow:0 2px 0 rgba(0,0,0,.28)}
.in-h div{min-width:0;flex:1}
.in-h b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.in-h span{display:block;font-size:12px;color:var(--ink-2)}
.x{width:30px;height:30px;border-radius:10px;border:0;background:var(--panel-2);font-size:18px;line-height:1;flex:none}
.quirk{margin:0;font-size:13.5px;color:var(--ink-2);font-style:italic}
.inspect small,.list small{display:block;font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.now b{display:block;font-size:15.5px;font-weight:700;line-height:1.25}
.now .task{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-2)}
.now .task code{font-family:var(--mono);font-size:11.5px;color:var(--cream)}
.route{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.route li{font:500 10.5px var(--mono);padding:2px 7px;border-radius:7px;background:var(--panel-2);color:var(--ink-3)}
.route li.done{color:var(--ink-2);text-decoration:line-through;text-decoration-color:rgba(255,244,214,.3)}
.route li.cur{background:var(--cream);color:var(--on-cream);font-weight:700}
.route li.g{box-shadow:inset 0 0 0 1.5px var(--amber)}
.lvl b{font-size:15px;font-weight:700}
.lvl span{display:block;font-size:12.5px;color:var(--ink-2)}
.lvbar{display:flex;gap:3px;margin-bottom:6px}
.lvbar i{height:7px;flex:1;border-radius:4px;background:var(--panel-2)}
.lvbar i.on{background:var(--c,var(--cream))}
.badge ul,.rules{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.badge li,.rules li{font-size:12.5px;color:var(--ink-2);padding-left:16px;position:relative}
.badge li::before{content:"";position:absolute;left:1px;top:6px;width:8px;height:5px;border-left:2px solid var(--mint);border-bottom:2px solid var(--mint);rotate:-45deg}
.rules li::before{content:"";position:absolute;left:2px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.inspect p{margin:0;font-size:13.5px;color:var(--ink-2)}
.who{display:flex;flex-wrap:wrap;gap:5px}
.who button{border:0;border-radius:999px;padding:2px 10px 3px;background:var(--c);color:var(--on-cream);font-weight:700;font-size:12.5px}
.q{display:grid;gap:4px}.q div{font-size:12.5px;color:var(--ink-2)}.q code{font-family:var(--mono);font-size:11px;color:var(--cream);margin-right:6px}
.acts{display:flex;flex-wrap:wrap;gap:7px}

.btn{border:0;border-radius:13px;padding:9px 15px 10px;font-weight:700;font-size:14px;line-height:1.1;background:var(--cream);color:var(--on-cream);box-shadow:0 3px 0 var(--cream-lip);transition:transform .07s,box-shadow .07s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--cream-lip)}
.btn.pri{background:var(--coral);box-shadow:0 3px 0 var(--coral-lip);color:#2A0E06}
.btn.pri:active{box-shadow:0 0 0 var(--coral-lip)}
.btn.warn{background:var(--amber);box-shadow:0 3px 0 var(--amber-lip)}
.btn.warn:active{box-shadow:0 0 0 var(--amber-lip)}
.btn.ghost{background:rgba(255,244,214,.1);color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:active{transform:translateY(1px)}
.btn.ghost[aria-pressed="true"]{background:var(--cream);color:var(--on-cream)}
.btn.sm{padding:7px 12px 8px;font-size:13px}
.btn.ic{padding:8px 10px;display:inline-grid;place-items:center}.btn.ic svg{display:block}
.btn:disabled{opacity:.45;cursor:default}

.alerts{left:50%;top:76px;translate:-50% 0;width:min(470px,calc(100% - 2*var(--g)));display:grid;gap:8px;pointer-events:none}
.al{pointer-events:auto;background:var(--cream);color:var(--on-cream);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 11px;box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 4px rgba(255,200,87,.35);animation:drop .35s cubic-bezier(.3,1.5,.5,1)}
.al.inc{box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 0 4px rgba(255,84,112,.45)}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.al .av{width:40px;height:34px;border-radius:11px;grid-row:span 2;align-self:start}
.al .av::before{width:27px;height:14px;border-radius:6px}
.al .av::after{width:5px;height:7px;box-shadow:9px 0 0 var(--cream);translate:-4.5px 0}
.al b{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.al .t span{display:block;font-size:13px;line-height:1.3}
.al .t em{display:block;font-style:normal;font-size:13px;font-weight:700;color:#8A3A12;margin-top:2px}
.al.inc .t em{color:#A3143A}
.al .b{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.al .btn.ghost{background:rgba(26,22,66,.08);color:var(--on-cream);box-shadow:inset 0 0 0 1.5px rgba(26,22,66,.25)}
.al code{font-family:var(--mono);font-size:11.5px}
.more{pointer-events:auto;justify-self:center;font-size:12px;font-weight:700;background:var(--panel);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--cream)}

.radio{left:var(--g);bottom:140px;width:306px;padding:9px 12px;display:grid;gap:3px}
.radio p{margin:0;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio p:last-child{color:var(--cream)}
.radio time{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-right:7px}
.radio .k-wait,.radio .k-approve{color:var(--amber)}.radio .k-incident,.radio .k-deny{color:#FF8FA3}.radio .k-ship{color:var(--pink)}.radio .k-level{color:var(--mint)}

.coach{right:var(--g);bottom:140px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:12px;font-size:13px}
.coach b{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.coach span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.coach span i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3)}
.coach span.ok{color:var(--cream)}.coach span.ok i{background:var(--mint);border-color:var(--mint)}
.coach button{border:0;background:transparent;font-size:18px;line-height:1;color:var(--ink-3);padding:0 4px}

.bar{left:0;right:0;bottom:0;padding:26px var(--g) calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,rgba(11,12,38,.86) 38%);display:grid;gap:9px}
.time{display:flex;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:4px 10px;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line);font:700 10.5px var(--mono);letter-spacing:.08em;min-width:84px;justify-content:center}
.live i{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(111,232,192,.25)}
.live.past{background:var(--amber);color:var(--on-cream);box-shadow:0 3px 0 var(--amber-lip)}
.live.past i{background:var(--on-cream);box-shadow:none}
.track{position:relative;flex:1;height:26px;display:flex;align-items:center}
.marks{position:absolute;left:8px;right:8px;top:50%;height:0}
.marks i{position:absolute;top:-10px;width:3px;height:7px;border-radius:2px;background:var(--ink-3)}
.marks .k-wait{background:var(--amber)}.marks .k-incident{background:var(--red);height:9px;top:-12px}.marks .k-ship{background:var(--pink)}
#scrub{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:rgba(255,244,214,.18);margin:0;cursor:ew-resize}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--cream);box-shadow:0 2px 0 var(--cream-lip);border:0}
#scrub::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--cream);box-shadow:0 2px 0 var(--cream-lip);border:0}
.clock{font:500 12px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.send,.views{display:flex;gap:8px;flex-wrap:wrap}
.ask{flex:1;min-width:220px;display:flex;gap:6px;background:var(--panel);border:1.5px solid var(--line);border-radius:15px;padding:4px 4px 4px 14px}
.ask input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:14px}
.ask input::placeholder{color:var(--ink-3)}
.ask:focus-within{border-color:var(--amber)}
.answer{font-size:13.5px;color:var(--on-cream);background:var(--cream);border-radius:12px;padding:7px 12px;justify-self:start;max-width:100%;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.credit{left:0;right:0;bottom:calc(4px + env(safe-area-inset-bottom,0px));text-align:center;font-size:10.5px;color:var(--ink-3);pointer-events:none}

.list{left:246px;right:var(--g);top:78px;bottom:150px;padding:14px;overflow:auto;z-index:3}
.list-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.list-h b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.list-h span{font-size:12.5px;color:var(--ink-2);margin-left:10px}
.app[data-list="1"] .radio,.app[data-list="1"] .coach,.app[data-list="1"] .alerts{display:none}
.tbl{display:grid;gap:4px;min-width:900px}
.tr{display:grid;grid-template-columns:120px 150px minmax(200px,1fr) 100px 56px 66px 236px;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;font-size:13px}
.tr.h{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-block:2px}
.tr:not(.h){background:var(--panel-2)}
.tr.need{box-shadow:inset 0 0 0 1.5px var(--amber)}.tr.held{box-shadow:inset 0 0 0 1.5px var(--red)}
.tr .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.tr .num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.tr .do{color:var(--cream);min-width:0}.tr .do em{display:block;font-style:normal;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tr .ac{display:flex;gap:6px;justify-content:flex-end}
.scroll{overflow-x:auto}

.fail{position:absolute;inset:0;z-index:9;display:grid;place-content:center;gap:8px;text-align:center;padding:24px;background:var(--night)}
.fail b{font-size:22px}.fail span{color:var(--ink-2);max-width:42ch}

@media (max-width:900px){
  .inspect{width:280px}
  .radio,.coach{display:none}
  .list{left:var(--g)}
}
@media (max-width:700px){
  :root{--g:16px}
  .top{padding-top:10px}
  .mark{width:36px;height:36px}.brand-t b{font-size:21px}.brand-t span{font-size:11px}
  .st{min-width:0;padding:4px 8px 5px}.st b{font-size:15px}.st span{font-size:9px}
  .st.spend,.st.ship{display:none}
  .crew{top:62px;left:0;right:0;width:auto;max-height:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-radius:0;border-inline:0;padding:6px var(--g);gap:6px;scrollbar-width:none}
  .crew h2{display:none}
  .cw{width:auto;flex:none;padding:4px 9px 4px 5px;background:var(--panel-2)}
  .cw em,.cw .lv{display:none}
  .alerts{top:112px}
  .inspect{left:var(--g);right:var(--g);top:auto;bottom:206px;width:auto;max-height:30%;padding:12px;gap:9px}
  .inspect .quirk,.inspect .badge{display:none}
  .in-h b{font-size:19px}
  .al{padding:10px 12px;border-radius:16px}.al b{font-size:15.5px}.al .btn{padding:7px 12px 8px;font-size:13px}
  .slab{font-size:9px;padding:2px 6px 1px}.tag{font-size:11px;padding:0 6px 1px}.bub{font-size:11.5px;padding:3px 8px 4px}
  .list{top:112px;bottom:206px}
  .bar{padding-top:18px;gap:8px}
  .send{flex:1}.send .btn{flex:1}
  .ask{order:3;flex-basis:100%}
  .views{order:2}
  #rotL,#rotR{display:none}
  .credit{font-size:9.5px}
}
@media (max-height:720px) and (min-width:701px){.radio{display:none}.coach{bottom:132px}}
@media (prefers-reduced-motion:reduce){.bub.on,.al,.st.need.on{animation:none}}
</style>
<div class="app" id="app" data-zoom="mid">
  <canvas id="gl" role="img" aria-label="A floating base seen from above. Eight small robots carry parcels between stations: Inbox, Briefing, Library, Workshop, Checkpoint, the Gate, Launchpad, a Charging Dock and a Vault."></canvas>
  <div class="tags" id="tags" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 16v-6" stroke="#FFF4D6" stroke-width="3.2" stroke-linecap="round"/><circle cx="32" cy="7.5" r="4.2" fill="#FFC857"/><path d="M52 37 42.5 53.5h-21L12 37l9.5-16.5h21Z" fill="#FF7A59" stroke="#FF7A59" stroke-width="7" stroke-linejoin="round"/><rect x="22.5" y="29.5" width="6" height="13" rx="3" fill="#FFF4D6"/><rect x="35.5" y="29.5" width="6" height="13" rx="3" fill="#FFF4D6"/></svg>
